pass_threshold: 0.85

sections:
  - id: mapped_subsections
    name: "each [N] — [SECTION NAME] block"
    match: dynamic
    weight: 0.55
    purpose: "Evidence is assigned by purpose fit, not global quality rank; every subsection must receive evidence that actually serves its stated job."
    dimensions:
      structural:
        weight: 0.15
        checks:
          - "Evidence assigned carries an explicit HIGH/MED fit label — never LOW, never unlabeled"
      content_completeness:
        weight: 0.20
        checks:
          - "No more than 3 items assigned, unless subsection complexity genuinely warrants more"
          - "If flagged GAP instead: names specifically what evidence type is missing"
      quality:
        weight: 0.25
        checks:
          - "The 'how it serves' line is specific to this exact subsection"
      purpose_alignment:
        weight: 0.40
        checks:
          - "Evidence assigned is a genuine content fit for this subsection"
          - "If GAP-flagged: the GAP is honest rather than filled with a stretched citation"
    red_flags:
      - "The same evidence point/stat/quote is reused in another subsection"
      - "A citation is topically related but does not support this subsection's specific point"

  - id: punch_line_check
    name: "PUNCH LINE"
    match: fixed
    weight: 0.05
    purpose: "Preserve the approved blueprint's specific, quotable punch line."
    dimensions:
      content_completeness:
        weight: 0.40
        checks:
          - "Present and not replaced with a placeholder"
      quality:
        weight: 0.60
        checks:
          - "Specific to this chapter's actual argument"

  - id: coverage_summary
    name: "Coverage summary"
    match: fixed
    weight: 0.25
    purpose: "Accurately exposes evidence coverage, GAPs, and unplaced research for downstream Deep Research."
    dimensions:
      structural:
        weight: 0.30
        checks:
          - "Metrics, GAPs table, and Unplaced Items table are all present"
      content_completeness:
        weight: 0.30
        checks:
          - "Every unplaced item has a specific reason"
          - "GAP count is at or below the chapter threshold unless a clear exception is documented"
      consistency:
        weight: 0.40
        checks:
          - "No subsection is silently blank"
          - "Summary counts match the actual mapped blocks"

  - id: duplicate_point_check
    name: "cross-subsection duplicate use of the same source"
    match: fixed
    weight: 0.05
    purpose: "Where one source serves multiple subsections, each location must use a genuinely different point."
    dimensions:
      consistency:
        weight: 1.0
        checks:
          - "No identical point, statistic, quote, or framing is reused across two subsections"

  - id: v2_visual_boundary
    name: "V2 evidence-only boundary"
    match: fixed
    weight: 0.10
    purpose: "Research Mapping supplies subsection-to-source evidence lineage only. Visual discovery and image decisions belong exclusively to downstream Visual Research."
    dimensions:
      structural:
        weight: 0.50
        checks:
          - "No IMAGE NEEDED/YES/NO field appears anywhere"
          - "No visual ID, image candidate, figure recommendation, image reason, screenshot recommendation, visual recommendation, or Human Decision field appears anywhere"
      purpose_alignment:
        weight: 0.50
        checks:
          - "Mapped source URLs are present as evidence provenance and are not being used to make visual-selection decisions"
    red_flags:
      - "Any visual planning, visual search, visual recommendation, or image-selection field is present in the Research Mapping artifact"
